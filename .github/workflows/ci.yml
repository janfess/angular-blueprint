name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Tests (Headless)
      run: npm run test -- --watch=false --browsers=ChromeHeadless
      
    - name: Run Angular Build (Production + SSR)
      run: npm run build:prod
      
    - name: Verify Build Artifacts
      run: |
        for locale in de en; do
          if [ ! -f "dist/personal-website/browser/$locale/index.html" ]; then
            echo "Build failed: prerendered $locale/index.html missing"
            exit 1
          fi
        done
        echo "Build succeeded. Artifacts verified."
